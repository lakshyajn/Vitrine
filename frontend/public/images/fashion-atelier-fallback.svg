<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Editorial fashion studio showroom with tailored garments on a minimalist clothing rail">
  <defs>
    <!-- Studio Ambient Gradient -->
    <linearGradient id="studio-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F6F7" />
      <stop offset="45%" stop-color="#F1ECF0" />
      <stop offset="100%" stop-color="#E5DEE4" />
    </linearGradient>

    <!-- Morning Window Light Beam -->
    <linearGradient id="window-light" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Floor Shadow Plane -->
    <linearGradient id="floor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5DEE4" />
      <stop offset="100%" stop-color="#D2C8D1" />
    </linearGradient>

    <!-- Steel Rail Gradient -->
    <linearGradient id="steel-rail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2A222C" />
      <stop offset="50%" stop-color="#161117" />
      <stop offset="100%" stop-color="#2A222C" />
    </linearGradient>

    <!-- Garment 1: Natural Linen Coat -->
    <linearGradient id="linen-coat" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#EAE5DC" />
      <stop offset="50%" stop-color="#D9D0C3" />
      <stop offset="100%" stop-color="#B8AC9C" />
    </linearGradient>

    <!-- Garment 2: Deep Plum / Aubergine Tailored Blazer -->
    <linearGradient id="aubergine-blazer" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#5E1D5F" />
      <stop offset="50%" stop-color="#4A154B" />
      <stop offset="100%" stop-color="#280729" />
    </linearGradient>

    <!-- Garment 3: Charcoal Wool Trousers / Tunic -->
    <linearGradient id="charcoal-garment" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#362E38" />
      <stop offset="50%" stop-color="#231B25" />
      <stop offset="100%" stop-color="#140E16" />
    </linearGradient>

    <!-- Textile Swatch Plinth -->
    <linearGradient id="plinth-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EDE7EB" />
      <stop offset="100%" stop-color="#E0D6DD" />
    </linearGradient>
    <linearGradient id="plinth-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D2C8D1" />
      <stop offset="100%" stop-color="#BDB0BC" />
    </linearGradient>

    <!-- Soft Ambient Filters -->
    <filter id="blur-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
    <filter id="soft-cast" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" />
    </filter>
  </defs>

  <!-- Studio Background Wall -->
  <rect width="1200" height="900" fill="url(#studio-bg)" />

  <!-- Diagonal Window Sunlight -->
  <polygon points="0,0 750,0 520,900 0,900" fill="url(#window-light)" />

  <!-- Studio Floor Line -->
  <polygon points="0,680 1200,680 1200,900 0,900" fill="url(#floor-grad)" />
  <line x1="0" y1="680" x2="1200" y2="680" stroke="#D2C8D1" stroke-width="1.5" />

  <!-- Rail Cast Shadow on Floor -->
  <ellipse cx="600" cy="740" rx="380" ry="16" fill="#161117" opacity="0.16" filter="url(#blur-shadow)" />

  <!-- Architectural Minimalist Clothing Rail (Blackened Steel) -->
  <g id="clothing-rail">
    <!-- Left Upright Post -->
    <rect x="280" y="220" width="8" height="520" rx="2" fill="url(#steel-rail)" />
    <ellipse cx="284" cy="740" rx="24" ry="6" fill="url(#steel-rail)" />

    <!-- Right Upright Post -->
    <rect x="912" y="220" width="8" height="520" rx="2" fill="url(#steel-rail)" />
    <ellipse cx="916" cy="740" rx="24" ry="6" fill="url(#steel-rail)" />

    <!-- Horizontal Top Bar -->
    <rect x="260" y="216" width="680" height="8" rx="2" fill="url(#steel-rail)" />
    <!-- Steel Corner Welds -->
    <circle cx="284" cy="220" r="6" fill="#161117" />
    <circle cx="916" cy="220" r="6" fill="#161117" />
  </g>

  <!-- Garment 1: Natural Linen Duster Coat (Left) -->
  <g id="garment-linen">
    <!-- Hanger Hook & Wood Bar -->
    <path d="M 380,216 Q 380,200 375,195 Q 370,190 370,185 Q 370,175 380,175 Q 390,175 390,185 Q 390,195 380,205" fill="none" stroke="#6B626E" stroke-width="2.5" />
    <polygon points="320,230 440,230 435,236 325,236" fill="#9C8F7E" />

    <!-- Coat Body Silhouette -->
    <path d="M 340,236 
             L 320,280 L 335,460 L 345,610 L 415,610 L 425,460 L 440,280 L 420,236 
             Z" 
          fill="url(#linen-coat)" />
    <!-- Coat Collar & Lapels -->
    <polygon points="360,236 380,320 370,410 380,410 390,320 400,236" fill="#C7BCAE" />
    <!-- Belt Tie Detail -->
    <rect x="335" y="390" width="90" height="8" rx="1" fill="#B3A594" />
    <line x1="390" y1="398" x2="390" y2="460" stroke="#9C8E7E" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Garment 2: Tailored Aubergine Double-Breasted Blazer (Center Feature) -->
  <g id="garment-aubergine-blazer">
    <!-- Drop Shadow on Floor -->
    <ellipse cx="580" cy="735" rx="70" ry="12" fill="#161117" opacity="0.25" filter="url(#soft-cast)" />

    <!-- Hanger Hook & Wood Bar -->
    <path d="M 580,216 Q 580,200 575,195 Q 570,190 570,185 Q 570,175 580,175 Q 590,175 590,185 Q 590,195 580,205" fill="none" stroke="#2A222C" stroke-width="2.5" />
    <polygon points="500,228 660,228 654,235 506,235" fill="#201722" />

    <!-- Blazer Silhouette -->
    <path d="M 520,235 
             C 490,270 480,320 490,440 
             L 510,540 L 650,540 L 670,440 
             C 680,320 670,270 640,235 
             Z" 
          fill="url(#aubergine-blazer)" />

    <!-- Peak Lapels & Breast Pocket -->
    <polygon points="545,235 520,330 570,390 580,360 565,290" fill="#6B226D" />
    <polygon points="615,235 640,330 590,390 580,360 595,290" fill="#3D103E" />
    <!-- Breast Welt Pocket -->
    <rect x="525" y="310" width="30" height="4" rx="0.5" fill="#320C33" />

    <!-- Double Breasted Horn Buttons -->
    <circle cx="560" cy="400" r="4.5" fill="#CF1E1E" stroke="#FFFFFF" stroke-width="0.8" />
    <circle cx="600" cy="400" r="4.5" fill="#161117" stroke="#6B226D" stroke-width="0.8" />
    <circle cx="560" cy="445" r="4.5" fill="#161117" stroke="#6B226D" stroke-width="0.8" />
    <circle cx="600" cy="445" r="4.5" fill="#161117" stroke="#6B226D" stroke-width="0.8" />

    <!-- Subtle Drape Shadows -->
    <path d="M 550,470 Q 560,510 565,540" stroke="#280729" stroke-width="2" fill="none" />
    <path d="M 610,470 Q 600,510 595,540" stroke="#280729" stroke-width="2" fill="none" />
  </g>

  <!-- Garment 3: Tailored Pleated Trousers (Right) -->
  <g id="garment-trousers">
    <!-- Hanger Bar -->
    <path d="M 780,216 Q 780,195 775,190 Q 770,185 780,175 Q 790,185 780,205" fill="none" stroke="#6B626E" stroke-width="2.5" />
    <rect x="730" y="228" width="100" height="5" rx="1" fill="#201722" />

    <!-- Trouser Silhouette -->
    <path d="M 740,233 L 735,590 L 768,590 L 775,370 L 785,370 L 792,590 L 825,590 L 820,233 Z" fill="url(#charcoal-garment)" />
    <!-- Crease Lines -->
    <line x1="752" y1="260" x2="752" y2="585" stroke="#483F4B" stroke-width="1.5" />
    <line x1="808" y1="260" x2="808" y2="585" stroke="#483F4B" stroke-width="1.5" />
  </g>

  <!-- Concrete / Stone Plinth with Fabric Swatches (Right Foreground) -->
  <g id="swatch-plinth">
    <!-- Plinth Body -->
    <polygon points="980,590 1140,590 1170,640 1010,640" fill="url(#plinth-top)" />
    <polygon points="1010,640 1170,640 1170,750 1010,750" fill="url(#plinth-front)" />
    <ellipse cx="1090" cy="755" rx="85" ry="12" fill="#161117" opacity="0.2" filter="url(#soft-cast)" />

    <!-- Folded Textile Bolts on Plinth -->
    <polygon points="1025,605 1115,605 1125,625 1035,625" fill="#4A154B" />
    <rect x="1035" y="625" width="90" height="8" rx="1" fill="#370F38" />

    <polygon points="1040,585 1120,585 1128,605 1048,605" fill="#D9D0C3" />
    <rect x="1048" y="605" width="80" height="6" rx="1" fill="#B8AC9C" />
  </g>

  <!-- Editorial Apparel Specification Annotations -->
  <g id="apparel-annotations">
    <!-- Blazer Lead Line -->
    <line x1="490" y1="360" x2="410" y2="330" stroke="#161117" stroke-width="1" stroke-opacity="0.4" />
    <line x1="410" y1="330" x2="220" y2="330" stroke="#161117" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="490" cy="360" r="3" fill="#4A154B" />

    <text x="220" y="318" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5" fill="#4A154B">COLLECTION 06 · TAILORING</text>
    <text x="220" y="336" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#161117">Double-Breasted Linen Blazer</text>
    <text x="220" y="352" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#574D58">340gsm undyed flax · Size curve XS–XL</text>
    <text x="220" y="368" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" fill="#CF1E1E">Wholesale $145 · RRP $360 · MOQ 12</text>
  </g>
</svg>

